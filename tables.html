<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
  <style>
    body {
      font-family: Arial;
    }

    table {
      width: 60%;
      border: 1px solid black;
      margin: auto;
      border-collapse: collapse;
      /* merge borders*/
      
    }

    th {
      color: #f50a0a;
      border: 1px solid black;
      padding: 12px 4px;
      text-align: left;
    }

   

    .mshahara{
      color: #126c12;
      font-weight: bold;
    }

     td {
      color: #101071;
      border: 1px solid black;
      padding: 12px 4px;
      text-align: left;
    }

    thead {
      background-color: #f5f5f5;
    }
    /* CSS Frameworks */
  </style>
</head>

<body>
  <table>
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>City</th>
        <th>Age</th>
        <th>Salary</th>
      </tr>

    </thead>

    <tbody>
      <tr>
        <td>John</td>
        <td>Kahuha</td>
        <td>Kiambu</td>
        <td>25</td>
        <td class="mshahara">24000</td>
      </tr>

      <tr>
        <td>Leslie</td>
        <td>Mong'ina</td>
        <td>Thika</td>
        <td>20</td>
        <td class="mshahara">60000</td>
      </tr>

      <tr>
        <td>Victor</td>
        <td>Mugendi</td>
        <td>Juja</td>
        <td>27</td>
        <td class="mshahara">200000</td>
      </tr>

      <tr>
        <td>Louis</td>
        <td>Muriuki</td>
        <td>Nairobi</td>
        <td>21</td>
        <td class="mshahara">70000</td>
      </tr>

      <tr>
        <td>Hellen</td>
        <td>Waruguru</td>
        <td>Nakuru</td>
        <td>23</td>
        <td class="mshahara">75000</td>
      </tr>

    </tbody>
  </table>


  <!-- List Unordered -->
  <ul>
    <li>Kenya</li>
    <li>Ethiopia</li>
    <li>Uganda</li>
    <li>Tanzania</li>
    <li>Rwanda</li>
    <li>Burundi</li>
  </ul>

</body>

</html>
